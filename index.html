<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AirFly, agencia de viajes: explora destinos y compara vuelos y hoteles para planificar tu próximo viaje."
    />
    <title>AirFly · Vuelos y hoteles para tu próximo viaje</title>
    <!-- Aplica el tema antes de que cargue React para evitar un destello del tema claro.
         Usa la misma clave que src/utils/tema.js. Leer localStorage va en try/catch: con el
         almacenamiento bloqueado lanza SecurityError y se sigue la preferencia del sistema -->
    <script>
      (function () {
        var tema = null
        try {
          tema = localStorage.getItem('airfly-tema')
        } catch (e) {}
        if (tema !== 'oscuro' && tema !== 'claro') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'
        }
        document.documentElement.setAttribute('data-tema', tema)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
